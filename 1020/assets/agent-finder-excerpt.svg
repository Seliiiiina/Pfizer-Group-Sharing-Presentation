<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="480 20 420 500" role="img" aria-labelledby="title desc">
<title id="title">Agent Finder Retrieval and Scoring Flow</title>
<desc id="desc">Candidate retrieval, weighted scoring, no-match handling, ranking, and structured handoff to Agent Hub.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333" /></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#292929}.edge{fill:none;stroke:#444;stroke-width:1.5;marker-end:url(#arrow)}.node{fill:#eeebff;stroke:#9c78ff;stroke-width:1.5}</style>
<rect width="940" height="1900" fill="white" />
<path class="edge" data-from="A" data-to="P" d="M 680 155 L 680 205" />
<path class="edge" data-from="P" data-to="R" d="M 680 325 L 680 375" />
<path class="edge" data-from="R" data-to="E" d="M 680 495 L 680 545" />
<path class="edge" data-from="E" data-to="SC" d="M 680 665 L 680 715" />
<path class="edge" data-from="SC" data-to="W" d="M 680 835 L 680 885" />
<path class="edge" data-from="W" data-to="X" d="M 680 1005 L 680 1055" />
<path class="edge" data-from="X" data-to="N" d="M 525 1115 L 250 1115 Q 240 1115 240 1125 L 240 1225" />
<text x="400" y="1100">No</text>
<path class="edge" data-from="X" data-to="K" d="M 680 1200 L 680 1225" />
<text x="708" y="1212.5">Yes</text>
<path class="edge" data-from="K" data-to="L" d="M 680 1345 L 680 1395" />
<path class="edge" data-from="L" data-to="TOP" d="M 680 1515 L 680 1565" />
<path class="edge" data-from="TOP" data-to="H" d="M 680 1685 L 680 1735" />
<g id="node-A"><title>Agent Hub passes goal, task, constraints</title>
<rect class="node" x="495" y="35" width="370" height="120" />
<text x="680" y="89.5" text-anchor="middle">Agent Hub passes goal, task,</text>
<text x="680" y="112.5" text-anchor="middle">constraints</text>
</g>
<g id="node-P"><title>Identify Primary Category, Capability Tags, Domain Tags</title>
<rect class="node" x="495" y="205" width="370" height="120" />
<text x="680" y="259.5" text-anchor="middle">Identify Primary Category,</text>
<text x="680" y="282.5" text-anchor="middle">Capability Tags, Domain Tags</text>
</g>
<g id="node-R"><title>Retrieve candidate Business Subagents from Agent Registry</title>
<rect class="node" x="495" y="375" width="370" height="120" />
<text x="680" y="429.5" text-anchor="middle">Retrieve candidate Business</text>
<text x="680" y="452.5" text-anchor="middle">Subagents from Agent Registry</text>
</g>
<g id="node-E"><title>Evaluate fit from Registry evidence</title>
<rect class="node" x="495" y="545" width="370" height="120" />
<text x="680" y="599.5" text-anchor="middle">Evaluate fit from Registry</text>
<text x="680" y="622.5" text-anchor="middle">evidence</text>
</g>
<g id="node-SC"><title>Score candidates 0-100</title>
<rect class="node" x="495" y="715" width="370" height="120" />
<text x="680" y="781.0" text-anchor="middle">Score candidates 0-100</text>
</g>
<g id="node-W"><title>Apply weights: Capability 50, Domain 30, Input/Output 10, Availability and Permissions 10</title>
<rect class="node" x="495" y="885" width="370" height="120" />
<text x="680" y="928.0" text-anchor="middle">Apply weights: Capability 50,</text>
<text x="680" y="951.0" text-anchor="middle">Domain 30, Input/Output 10,</text>
<text x="680" y="974.0" text-anchor="middle">Availability and Permissions 10</text>
</g>
<g id="node-X"><title>Any suitable candidates?</title>
<polygon class="node" points="680,1030 835,1115 680,1200 525,1115" />
<text x="680" y="1109.5" text-anchor="middle">Any suitable</text>
<text x="680" y="1132.5" text-anchor="middle">candidates?</text>
</g>
<g id="node-N"><title>Return no_match with reason and next-step suggestion</title>
<rect class="node" x="55" y="1225" width="370" height="120" />
<text x="240" y="1279.5" text-anchor="middle">Return no_match with reason and</text>
<text x="240" y="1302.5" text-anchor="middle">next-step suggestion</text>
</g>
<g id="node-K"><title>Rank by score descending</title>
<rect class="node" x="495" y="1225" width="370" height="120" />
<text x="680" y="1291.0" text-anchor="middle">Rank by score descending</text>
</g>
<g id="node-L"><title>Return up to five candidates</title>
<rect class="node" x="495" y="1395" width="370" height="120" />
<text x="680" y="1461.0" text-anchor="middle">Return up to five candidates</text>
</g>
<g id="node-TOP"><title>Mark top recommendation</title>
<rect class="node" x="495" y="1565" width="370" height="120" />
<text x="680" y="1631.0" text-anchor="middle">Mark top recommendation</text>
</g>
<g id="node-H"><title>Return structured result to Agent Hub</title>
<rect class="node" x="495" y="1735" width="370" height="120" />
<text x="680" y="1789.5" text-anchor="middle">Return structured result to</text>
<text x="680" y="1812.5" text-anchor="middle">Agent Hub</text>
</g>
</svg>